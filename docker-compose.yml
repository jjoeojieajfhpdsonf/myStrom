services:
  mystrom-app:
    build: .
    container_name: mystrom-app
    restart: unless-stopped
    # Host-Netz: nur so kommen die UDP-Meldungen der Steckdosen (Port 7979) im Container an
    network_mode: host
    environment:
      PORT: ${MYSTROM_PORT:-8091}
      TZ: Europe/Zurich
      POLL_SECONDS: 30
      SOLAR_URL: ${SOLAR_URL:-http://127.0.0.1:8090}   # Standort und Strompreis vom Solar-Dashboard übernehmen
      # DEVICES: 192.168.1.50,192.168.1.51            # nur nötig, wenn sich eine Steckdose nicht von selbst meldet
      # DEMO: "1"                                       # drei simulierte Steckdosen zum Ausprobieren
    volumes:
      - ./data:/data
